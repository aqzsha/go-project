version: '3.9'

services:
  go-app:
    build: .
    container_name: kinoqor-booking-app
    ports:
      - '8050:8080'
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    environment:
      - ENV=development
    networks:
      - kinoqor

  postgres:
    image: postgres:16
    container_name: kinoqor_postgres
    environment:
      POSTGRES_USER: kinoqoruser
      POSTGRES_PASSWORD: kinoqorpass
      POSTGRES_DB: kinoqordb
    ports:
      - '5446:5432'
    networks:
      - kinoqor

  redis:
    image: redis:7
    container_name: kinoqor_redis
    ports:
      - '6379:6379'
    networks:
      - kinoqor

networks:
  kinoqor:
    driver: bridge
