version: "3.9"

services:
  go-app:
    build: .
    container_name: do-auth-app
    ports:
      - "8050:8080"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    environment:
      - ENV=development
    networks:
      - digital-office

  postgres:
    image: postgres:16
    container_name: do_postgres
    environment:
      POSTGRES_USER: douser
      POSTGRES_PASSWORD: dopass
      POSTGRES_DB: dodb
    ports:
      - "5446:5432"
    networks:
      - digital-office

  redis:
    image: redis:7
    container_name: do_redis
    ports:
      - "6379:6379"
    networks:
      - digital-office

networks:
  digital-office:
    driver: bridge
