<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta
      http-equiv="Content-Type"
      content="text/html; charset=UTF-8"
    />
    <title>{{.Subject}}</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    "
  >
    <table
      width="100%"
      bgcolor="#f5f5f5"
      cellpadding="0"
      cellspacing="0"
    >
      <tr>
        <td
          align="center"
          style="padding: 30px 10px"
        >
          <table
            width="600"
            cellpadding="0"
            cellspacing="0"
            bgcolor="#ffffff"
            style="border-radius: 8px; overflow: hidden"
          >
            <tr>
              <td
                align="center"
                style="padding: 24px"
              >
                <div
                  style="
                    font-size: 22px;
                    font-weight: bold;
                    color: #2c3e50;
                    margin-bottom: 16px;
                  "
                >
                  {{.Subject}}
                </div>

                <table
                  cellpadding="0"
                  cellspacing="0"
                  align="center"
                  style="margin-bottom: 24px"
                >
                  <tr>
                    <td
                      align="center"
                      style="
                        background: #f4f5f6;
                        border: 1px solid #f4f5f6;
                        padding: 12px 20px;
                        border-radius: 30px;
                        display: inline-block;
                      "
                    >
                      <span
                        style="
                          font-size: 28px;
                          font-weight: bold;
                          letter-spacing: 4px;
                          color: #2c3e50;
                        "
                      >
                        {{.PinCode}}
                      </span>
                    </td>
                  </tr>
                </table>

                <div
                  style="
                    font-size: 14px;
                    line-height: 20px;
                    color: #555555;
                    margin-bottom: 24px;
                  "
                >
                  Не передавайте код другим людям. Если вы не запрашивали
                  подтверждение, проигнорируйте это письмо.
                </div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
